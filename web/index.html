<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recherche Globale</title>
<style>
  :root { --bg:#121212; --panel:#1e1e1e; --hover:#2a2a2a; --accent:#00f2fe; --text:#ffffff; --muted:#aaaaaa; --border:#333333; --mark:rgba(0,242,254,.25); --on-accent:#000000; }
  :root[data-theme="light"] { --bg:#f4f5f7; --panel:#ffffff; --hover:#eef0f3; --accent:#007a8a; --text:#16181d; --muted:#5d6470; --border:#d7dbe1; --mark:rgba(0,122,138,.18); --on-accent:#ffffff; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f4f5f7; --panel:#ffffff; --hover:#eef0f3; --accent:#007a8a; --text:#16181d; --muted:#5d6470; --border:#d7dbe1; --mark:rgba(0,122,138,.18); --on-accent:#ffffff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 60px; }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { margin:0; font-size:1.5rem; }
  h1 span { color:var(--accent); }
  .info { color:var(--muted); font-size:.85rem; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:16px; }
  .ligne { display:flex; gap:10px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:6px; padding:12px 14px; font-size:1rem; }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:var(--on-accent); border:0; border-radius:6px; padding:12px 20px; font-weight:600; font-size:1rem; cursor:pointer; min-height:44px; }
  button.sec { background:transparent; color:var(--muted); border:1px solid var(--border); font-weight:400; padding:6px 12px; min-height:32px; font-size:.85rem; }
  button.sec:hover { color:var(--accent); border-color:var(--accent); }
  .options { display:flex; gap:18px; flex-wrap:wrap; margin-top:12px; color:var(--muted); font-size:.9rem; }
  .options label { cursor:pointer; display:flex; align-items:center; gap:6px; }
  .annees { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
  .annees .titre { color:var(--muted); font-size:.85rem; margin-right:4px; }
  .pill { border:1px solid var(--border); border-radius:20px; padding:4px 12px; font-size:.85rem; cursor:pointer; user-select:none; color:var(--muted); }
  .pill.on { border-color:var(--accent); color:var(--accent); background:var(--mark); }
  .aide { color:var(--muted); font-size:.82rem; margin-top:8px; }
  #stats { color:var(--muted); margin:8px 0 14px; }
  .res { background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:6px; padding:12px 14px; margin-bottom:12px; }
  .res-tete { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
  .res-titre { font-weight:600; overflow-wrap:anywhere; }
  .badge { color:var(--accent); font-size:.8rem; border:1px solid var(--accent); border-radius:4px; padding:0 6px; margin-right:6px; }
  .actions { display:flex; gap:6px; flex-shrink:0; }
  .ctx { font-size:.92rem; color:var(--muted); }
  .ctx div { padding:2px 0; }
  .ctx .t { font-family:ui-monospace,Consolas,monospace; font-size:.8rem; margin-right:8px; opacity:.8; }
  .ctx .hit { color:var(--text); }
  mark { background:var(--mark); color:var(--accent); border-radius:3px; padding:0 2px; font-weight:600; }
  .vide { text-align:center; color:var(--muted); padding:40px 10px; }
  .erreur { color:#ff6b6b; }
  a { color:var(--accent); }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--accent); color:var(--on-accent); padding:8px 16px; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; }
  @media (max-width:600px) { .res-tete { flex-direction:column; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔎 Recherche <span>Globale</span></h1>
    <div class="info" id="info">Chargement…</div>
  </header>

  <div class="panel" id="panel-charger" hidden>
    <div style="margin-bottom:10px">Aucune base chargée. Indiquez le chemin complet du fichier de fusion SRT :</div>
    <div class="ligne">
      <input type="text" id="chemin" placeholder="ex. C:\Donnees\FUSION_GLOBALE_SRT.txt">
      <button onclick="charger()">Charger</button>
    </div>
    <div class="aide">Astuce : placez <b>FUSION_GLOBALE_SRT.txt</b> à côté du programme, il sera chargé automatiquement.</div>
    <div class="aide erreur" id="err-charger"></div>
  </div>

  <div class="panel" id="panel-recherche" hidden>
    <div class="ligne">
      <input type="text" id="termes" placeholder="Mots ou expressions, séparés par des virgules" autofocus>
      <button onclick="rechercher()">Rechercher</button>
    </div>
    <div class="options">
      <label><input type="checkbox" id="accents" checked> Ignorer les accents</label>
      <label><input type="checkbox" id="motentier"> Mot entier</label>
    </div>
    <div class="annees">
      <span class="titre">📅 Années :</span>
      <span id="annees" style="display:contents"></span>
      <button class="sec" onclick="toutes(true)">Tout</button>
      <button class="sec" onclick="toutes(false)">Aucun</button>
    </div>
  </div>

  <div id="stats"></div>
  <div id="resultats"></div>
</div>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(url, body) {
  const r = await fetch(url, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  const d = await r.json();
  if (!r.ok) throw new Error(d.erreur || 'Erreur');
  return d;
}

async function etat() {
  const e = await api('/api/etat');
  if (e.chargement) { $('info').textContent = 'Chargement de la base…'; setTimeout(etat, 500); return; }
  if (!e.fichier) {
    $('info').textContent = 'v' + e.version;
    $('panel-charger').hidden = false; $('panel-recherche').hidden = true;
    $('err-charger').textContent = e.erreur || '';
    return;
  }
  $('panel-charger').hidden = true; $('panel-recherche').hidden = false;
  $('info').textContent = `${e.videos} vidéos · ${e.phrases.toLocaleString('fr-FR')} phrases` + (e.liens ? ` · ${e.liens} liens` : '') + ` · v${e.version}`;
  $('info').title = e.fichier;
  $('annees').innerHTML = e.annees.map(a => `<span class="pill on" data-a="${esc(a)}" onclick="this.classList.toggle('on')">${esc(a)}</span>`).join('');
  $('termes').focus();
  const q = new URLSearchParams(location.search).get('q');
  if (q) { $('termes').value = q; rechercher(); }
}

async function charger() {
  $('err-charger').textContent = '';
  try { await api('/api/charger', {chemin:$('chemin').value}); etat(); }
  catch (e) { $('err-charger').textContent = e.message; }
}

function toutes(on) { document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', on)); }

function surligner(texte, spans) {
  let out = '', pos = 0;
  for (const [d, f] of spans) { out += esc(texte.slice(pos, d)) + '<mark>' + esc(texte.slice(d, f)) + '</mark>'; pos = f; }
  return out + esc(texte.slice(pos));
}

function secondes(t) {
  const [h, m, s] = t.replace(',', '.').split(':').map(Number);
  return Math.floor(h * 3600 + m * 60 + s);
}

function lienHorodate(url, temps) {
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 't=' + secondes(temps);
}

async function rechercher() {
  const termes = $('termes').value.trim();
  if (!termes) return;
  const pills = [...document.querySelectorAll('.pill')];
  const annees = pills.filter(p => p.classList.contains('on')).map(p => p.dataset.a);
  if (!annees.length) { $('stats').textContent = 'Sélectionnez au moins une année.'; $('resultats').innerHTML = ''; return; }
  $('stats').textContent = 'Recherche…';
  try {
    const d = await api('/api/recherche', {
      termes, annees: annees.length === pills.length ? [] : annees,
      mot_entier: $('motentier').checked, ignorer_accents: $('accents').checked
    });
    const plus = d.total > d.resultats.length ? ` — ${d.resultats.length} premiers affichés` : '';
    $('stats').textContent = `${d.total} passage(s) dans ${d.videos} vidéo(s)${plus}`;
    $('resultats').innerHTML = d.resultats.length ? d.resultats.map(r => `
      <div class="res">
        <div class="res-tete">
          <div class="res-titre"><span class="badge">${esc(r.temps.split(',')[0])}</span>${esc(r.titre)}</div>
          <div class="actions">
            ${r.lien ? `<a href="${esc(lienHorodate(r.lien, r.temps))}" target="_blank" rel="noopener"><button class="sec">▶ Voir</button></a>` : ''}
            <button class="sec" data-copie="${esc(r.titre + ' — ' + r.temps.split(',')[0])}" onclick="copier(this.dataset.copie)">📋 Copier</button>
          </div>
        </div>
        <div class="ctx">${r.contexte.map(c => `<div class="${c.trouve ? 'hit' : ''}"><span class="t">${esc(c.temps.split(',')[0])}</span>${c.trouve ? surligner(c.texte, c.surlignage) : esc(c.texte)}</div>`).join('')}</div>
      </div>`).join('') : '<div class="vide">Aucun résultat.</div>';
  } catch (e) { $('stats').innerHTML = `<span class="erreur">${esc(e.message)}</span>`; }
}

function copier(texte) {
  navigator.clipboard.writeText(texte).then(() => {
    const t = $('toast'); t.textContent = 'Copié'; t.style.opacity = 1;
    setTimeout(() => t.style.opacity = 0, 1200);
  });
}

$('termes').addEventListener('keydown', e => { if (e.key === 'Enter') rechercher(); });
$('chemin').addEventListener('keydown', e => { if (e.key === 'Enter') charger(); });
etat().catch(e => { $('info').innerHTML = `<span class="erreur">${esc(e.message)}</span>`; });
</script>
</body>
</html>
